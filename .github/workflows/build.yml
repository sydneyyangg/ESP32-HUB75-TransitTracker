name: Build HUB75 Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive        # fetches ESP32-HUB75-MatrixPanel-DMA

      - name: Build firmware with Docker
        run: docker build -t transit-build .

      - name: Extract firmware binary
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/output \
            transit-build \
            cp -r /project/.pio/build /output

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub75-firmware
          path: artifacts/build/**/*.bin